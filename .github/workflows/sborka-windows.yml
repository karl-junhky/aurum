name: Сборка Windows (пробная)

# Ручной запуск: Actions → «Сборка Windows (пробная)» → Run workflow.
# Собирает установщик AURUM на машине GitHub. Результат идёт как artifact
# (ссылка на скачивание в правом нижнем углу запуска, живёт 14 дней).
#
# ВАЖНО: это ПРОБНАЯ сборка (-Proba). Ворота выпуска и подпись кода здесь не
# проходят, поэтому установщик без подписи: Windows SmartScreen предупредит.
# Он выкладывается в Releases под именем AURUM-<версия>-setup.exe.
# Подписанный выпуск делается на твоём ПК сертификатом (ustanovka/podpisat.ps1).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cmd/affory-ui/frontend/package-lock.json

      - name: Установить NSIS
        run: choco install nsis -y --no-progress

      - name: Собрать ядро sing-box (с патчами из ustanovka/patches)
        shell: pwsh
        run: |
          & "${{ github.workspace }}\ustanovka\sobrat-yadro.ps1"
          if (-not (Test-Path "ustanovka\yadro\sing-box.exe")) { throw "ядро не собралось" }

      - name: Собрать пробный выпуск
        shell: pwsh
        env:
          AURUM_BEZ_TESTOV: "1"
        run: |
          $v = (Get-Content VERSIYA -Raw).Trim()
          & "${{ github.workspace }}\ustanovka\sobrat-reliz.ps1" -Versiya $v -Proba -Makensis "C:\Program Files (x86)\NSIS\makensis.exe"
          # Скрипт выпуска заканчивается проверкой, которая в пробной сборке отдаёт код 1
          # («тега ещё нет»). Само по себе это не поломка: смотрим, появился ли установщик.
          if (-not (Test-Path "ustanovka\vypusk\Affory-$v-setup.exe")) { throw "установщик не собрался" }
          exit 0

      - name: Выложить установщик
        uses: actions/upload-artifact@v4
        with:
          name: AURUM-proba-${{ github.sha }}
          path: |
            ustanovka/vypusk/*-setup.exe
            ustanovka/vypusk/affory-*.zip
            ustanovka/vypusk/NE-DLYA-VYKLADKI.txt
          retention-days: 14
          if-no-files-found: error

      - name: Опубликовать релиз
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content VERSIYA -Raw).Trim()
          $tag = "aurum-$v"
          $src = "ustanovka\vypusk\Affory-$v-setup.exe"
          if (-not (Test-Path $src)) { throw "нет установщика $src" }
          # В Releases файл называется AURUM. Внутри установщика всё как у Affory
          # (служба, пути), чтобы ядро и обновления остались совместимы с апстримом.
          $exe = "ustanovka\vypusk\AURUM-$v-setup.exe"
          Copy-Item $src $exe -Force
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $sha = "$exe.sha256"
          [System.IO.File]::WriteAllText((Join-Path $PWD $sha), "$hash  AURUM-$v-setup.exe`n")
          $notes = @"
          ## AURUM $v

          Стеклянный клиент для Windows на ядре Affory $v.

          **Установка.** Скачай ``AURUM-$v-setup.exe`` и запусти.

          **Windows может предупредить.** Эта сборка пока без цифровой подписи. Нажми «Подробнее», затем «Выполнить в любом случае».

          **Проверка файла.** Контрольная сумма SHA-256 лежит рядом, в ``AURUM-$v-setup.exe.sha256``.

          Служба и ядро называются Affory, как в оригинале: так обновления остаются совместимыми.
          "@
          # перевыпуск с тем же тегом заменяет прежний релиз
          gh release delete $tag --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0
          gh release create $tag $exe $sha --title "AURUM $v" --notes $notes --target ${{ github.sha }}
          if ($LASTEXITCODE -ne 0) { throw "не удалось создать релиз" }
